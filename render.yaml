services:
  - type: web
    name: formbot
    runtime: docker      # use Dockerfile — gives root access during build for Playwright deps
    plan: free

    # No buildCommand or packages needed — the Dockerfile handles everything

    startCommand: python main.py

    # Render injects PORT automatically; keep_alive.py reads it
    envVars:
      - key: BOT_TOKEN
        sync: false          # set manually in Render dashboard — never commit the value

      - key: ADMIN_TELEGRAM_ID
        sync: false

      - key: DATABASE_URL
        sync: false

      # Concurrency tuning — safe defaults for free tier (512 MB RAM)
      # Increase these when upgrading to a paid plan
      - key: MAX_GLOBAL_CONCURRENT_TABS
        value: "3"

      - key: MAX_TABS_PER_USER
        value: "1"

      - key: PAGE_TIMEOUT_MS
        value: "25000"

      - key: POST_SUBMIT_WAIT_MS
        value: "3000"

      - key: IDLE_HEARTBEAT_INTERVAL
        value: "20"

      - key: KEEP_ALIVE_PING_INTERVAL
        value: "240"

      # Keep-alive self-pinger needs the public URL to ping itself
      - key: RENDER_EXTERNAL_URL
        sync: false          # set manually to https://<your-service>.onrender.com

      # Render sets this automatically, but we declare it for clarity
      - key: PORT
        value: "10000"

      # Browsers are baked into the Docker image at /app/browsers (set in Dockerfile ENV)
      # PLAYWRIGHT_BROWSERS_PATH is already set in the Dockerfile — no need to repeat it here

    healthCheckPath: /health   # Render will also ping this to confirm the service is up
